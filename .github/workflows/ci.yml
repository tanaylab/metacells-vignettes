name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The versions are pinned because `make ci` compares the generated documents byte by byte
      # against the committed ones, so a different converter would report a drift that isn't one.
      # Upgrading either one means regenerating the documents in the same commit.
      - run: pip install nbconvert==7.16.6 playwright==1.62.0

      # The browser that generates the PDF needs system libraries which the runner does not have.
      - run: playwright install --with-deps chromium

      # Generates the documents and verifies they match the notebooks they were generated from.
      - run: make ci
